services:
  # Default: hot-reload development — `docker compose up --build`
  # http://localhost:3000  (bind-mounts ./app + ./src; UI edits without rebuild)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./projects:/app/projects
      # Save Plan writes versioned JSON here (shared with host git repo)
      - ./plans:/app/plans
      - /app/app/node_modules
      - /app/node_modules
      - /app/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - VDESIGN_PLANS_DIR=/app/plans

  # Production image (no hot reload): `docker compose --profile prod up --build prod`
  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./app/public/projects:/app/app/public/projects:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
