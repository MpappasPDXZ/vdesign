services:
  # Production: http://localhost:3000
  # projects/ is bind-mounted so floorplan.json / overlays update without rebuild
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./app/public/projects:/app/app/public/projects:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

  # Development (hot reload): docker compose --profile dev up dev
  # http://localhost:3000
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - /app/app/node_modules
      - /app/node_modules
      - /app/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
